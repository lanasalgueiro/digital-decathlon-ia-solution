atus:"resolvido",startedAt:"01/06/2026 09:00",resolvedAt:"09/06/2026 10:35",summary:"Quebra crítica de conversão na jornada de Guest Checkout: ao preencher o CEP no header ou editar o endereço no pagamento, os dados pessoais do carrinho eram esvaziados em silêncio, impedindo a conclusão do pedido e gerando perda imediata de receita.",scenario:"Ocorria com usuários não logados (guests) que chegavam ao checkout com CEP já preenchido pelo Header, ou que editavam/complementavam o endereço. Ao salvar número, complemento e destinatário, o checkout limpava o Profile e o receiverName, forçando regressão à etapa de dados pessoais — loop infinito entre Profile e Address.",rootCause:"Falha na persistência/sincronização do estado do carrinho via API. No salvamento dos dados complementares de Address, o manipulador de estado limpava ou sobrescrevia o nó de Profile e o receiverName, interpretando a atualização de endereço guest como reset da sessão.",resolution:"Ajuste na lógica de merge do payload de checkout para que atualizações na etapa de Address preservem Profile e receiverName. Deploy em produção; funil recuperou a faixa estável de ~34% em Shipping Method Selected.",actionItems:["Alertas proativos no Amplitude para desvio de conversão entre Checkout Commenced e Shipping Commenced.","Detecção de recorrência anormal de validação de Profile na mesma sessão (sinal de loop).","Notificações imediatas no Slack/Teams quando os monitores dispararem."]}},{id:"gi-2026-04-28",title:"Valor à vista (1x) exibido igual ao valor parcelado na modal de adicionar ao carrinho",date:"28/04/2026",severity:"crítica",monitored:!0,alerted:!0,documented:!0},{id:"checkout-vtex-config-conflict-2026-03",title:"Conflito de Configuração e Falha de Desativação (Checkout)",date:"23/04/2026",severity:"crítica",monitored:!1,alerted:!1,documented:!0,origin:"deploy",postMortem:{status:"resolvido",startedAt:"24/03/2026",resolvedAt:"24/04/2026 11:29",summary:"Configuração VTEX de modal rápido/barato permaneceu a
